name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logicost
          POSTGRES_PASSWORD: logicost
          POSTGRES_DB: logicost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logicost"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://logicost:logicost@localhost:5432/logicost
      TEST_DATABASE_URL: postgresql+psycopg://logicost:logicost@localhost:5432/logicost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . ../scripts --config pyproject.toml
      - run: ruff format --check . ../scripts --config pyproject.toml
      - run: pytest -q
      - name: Migrations e seed
        run: |
          alembic downgrade base
          alembic upgrade head
          python ../scripts/seed_demo_data.py
          python ../scripts/seed_demo_data.py
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logicost
          POSTGRES_PASSWORD: logicost
          POSTGRES_DB: logicost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logicost"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t logicost .
      - name: Sobe a imagem e confere API, seed e frontend
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql+psycopg://logicost:logicost@localhost:5432/logicost \
            -e SEED_DEMO=true logicost
          for i in $(seq 30); do curl -fs http://localhost:8000/api/v1/health && break; sleep 2; done
          curl -fs http://localhost:8000/ | grep -q "LogiCost Intelligence"
          curl -fs -X POST http://localhost:8000/api/v1/calculations/run \
            -H "Content-Type: application/json" \
            -d '{"period_start": "2026-07-01", "period_end": "2026-09-30"}' | grep -q '"completed"'
      - if: always()
        run: docker logs app
